<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc"><title id="title">Mallow the Woolly Mammoth — corrected four-legged crochet portrait</title><desc id="desc">Photorealistic original crochet concept: Mallow has exactly two short front legs and two broad hind legs, a curly brown cap, long trunk, two cream tusks, and large soft ears. No extra paws.</desc><rect width="720" height="720" fill="#fffaf5"/><image x="0" y="0" width="720" height="720" href="data:image/webp;base64,"/></svg>