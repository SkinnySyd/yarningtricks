<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" role="img" aria-labelledby="title desc"><title id="title">Single crochet loop-count: one, two, one</title><desc id="desc">Schematic loop-count sequence, not a photograph of hook placement.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf4"/><stop offset="1" stop-color="#f2ebe3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a16b7e" stroke-width="1.5"/></marker></defs><rect width="900" height="325" rx="25" fill="url(#paper)"/><rect x="14" y="14" width="872" height="297" rx="20" fill="none" stroke="#e4d5cc" stroke-width="2"/><text x="32" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#995e71">THREAD &amp; PETAL · LOOP COUNT GUIDE</text><g><rect x="52" y="80" width="206" height="157" rx="19" fill="#ffffff" stroke="#e7d9d0"/><path d="M 133 145 C 103 97, 151 97, 131 145 C 124 176, 153 182, 133 145" stroke="#d59eb0" stroke-width="8" stroke-linecap="round" fill="none"/><text x="155" y="205" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#765260">1 loops</text><text x="155" y="265" font-family="Georgia,serif" font-size="17" text-anchor="middle" fill="#594b49">Before inserting</text></g><g><rect x="347" y="80" width="206" height="157" rx="19" fill="#ffffff" stroke="#e7d9d0"/><path d="M 428 145 C 398 97, 446 97, 426 145 C 419 176, 448 182, 428 145" stroke="#92b09a" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M 440 145 C 410 97, 458 97, 438 145 C 431 176, 460 182, 440 145" stroke="#92b09a" stroke-width="8" stroke-linecap="round" fill="none"/><text x="450" y="205" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#765260">2 loops</text><text x="450" y="265" font-family="Georgia,serif" font-size="17" text-anchor="middle" fill="#594b49">Draw up a loop</text></g><g><rect x="642" y="80" width="206" height="157" rx="19" fill="#ffffff" stroke="#e7d9d0"/><path d="M 723 145 C 693 97, 741 97, 721 145 C 714 176, 743 182, 723 145" stroke="#bea2bf" stroke-width="8" stroke-linecap="round" fill="none"/><text x="745" y="205" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#765260">1 loops</text><text x="745" y="265" font-family="Georgia,serif" font-size="17" text-anchor="middle" fill="#594b49">Pull through both</text></g><path d="M275 164 H325" fill="none" stroke="#a16b7e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 164 H625" fill="none" stroke="#a16b7e" stroke-width="2.5" marker-end="url(#arrow)"/></svg>